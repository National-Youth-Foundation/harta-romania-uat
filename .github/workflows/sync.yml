name: Sync upstream mirror

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. 2025.1). Required for first run; optional after."
        required: false
        default: ""
      force_release:
        description: "Force creating/updating release even if no data changed"
        required: false
        type: boolean
        default: false
  schedule:
    # First day of each month at 03:17 UTC
    - cron: "17 3 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(date -u +'%Y.%m')" >> "$GITHUB_OUTPUT"
          fi

      - name: Save current manifest hashes
        run: |
          mkdir -p .ci
          jq -r '.files[] | "\(.upstream_url) \(.sha256 // "null")"' manifest.json > .ci/before.txt

      - name: Download upstream files
        run: python3 scripts/download_all.py --workers 6

      - name: Detect changes
        id: diff
        run: |
          jq -r '.files[] | "\(.upstream_url) \(.sha256 // "null")"' manifest.json > .ci/after.txt
          if diff -q .ci/before.txt .ci/after.txt > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            diff .ci/before.txt .ci/after.txt | head -50 || true
          fi

      - name: Split assets (small → git, big → release)
        if: steps.diff.outputs.changed == 'true' || inputs.force_release
        run: |
          python3 scripts/split_assets.py \
            --release-tag "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Create or update GitHub release
        if: steps.diff.outputs.changed == 'true' || inputs.force_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/make_release.py \
            --tag "${{ steps.tag.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Open PR with manifest + data updates
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/${{ steps.tag.outputs.tag }}
          title: "chore(sync): upstream changes ${{ steps.tag.outputs.tag }}"
          commit-message: "chore(sync): upstream changes ${{ steps.tag.outputs.tag }}"
          body: |
            Sincronizare automată cu geo-spatial.org.

            Release tag: `${{ steps.tag.outputs.tag }}`

            Schimbări detectate prin compararea hash-urilor SHA256 din `manifest.json`.
            Fișierele mari au fost (re)încărcate ca release assets;
            fișierele mici sunt incluse direct în acest PR.
          add-paths: |
            data/**
            manifest.json
          delete-branch: true
